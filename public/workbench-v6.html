<body><header><div class="brand"><div class="mark" aria-hidden="true">印</div><h1>隐私水印</h1><span class="draft">工作台 · 交互设计稿</span></div><div class="workflow"><span class="current"><b>1</b>上传图片</span><i>→</i><span><b>2</b>调整水印</span><i>→</i><span><b>3</b>导出图片</span></div><div class="privacy"><span></span>图片仅在本地处理</div></header>
<main class="layout" data-screen-label="水印工作台"><nav class="mobile-tabs" aria-label="工作台区域"><button class="active" data-pane="preview">图片预览</button><button data-pane="settings">水印设置</button></nav><div class="workspace">
<section class="preview"><div class="panelhead"><div class="title"><h2>图片预览</h2><span class="count" id="count">未添加图片</span></div><button class="textbtn" data-upload>＋ 添加图片</button></div><div class="stage"><div class="empty" id="empty"><div class="uploadmark" aria-hidden="true">↑</div><h3>把图片拖到这里</h3><p>支持批量添加，上传后即可预览水印</p><button class="blackbtn" data-upload>选择图片</button><button class="sample" id="sample">先用示例体验一下</button><div class="limits">JPG / PNG / WEBP　·　单张最大 10 MB</div></div><div class="canvasarea" id="canvasarea"><canvas id="previewcanvas"></canvas></div><button class="image-nav image-nav-prev" id="prev-image" type="button" aria-label="上一张图片" title="上一张图片" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="image-nav image-nav-next" id="next-image" type="button" aria-label="下一张图片" title="下一张图片" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="filmstrip" id="filmstrip"><div class="thumbs" id="thumbs"></div><button class="addthumb" data-upload aria-label="添加图片">＋</button><button class="textbtn mobile-adjust" id="adjust">调整水印 →</button><button class="textbtn" id="clear">清空</button></div></section>
<aside class="settings"><div class="panelhead"><div class="title"><h2>水印设置</h2></div><span class="live">实时预览</span></div><div class="fields"><div class="field"><div class="fieldlabel">使用场景<small>选择后自动填入水印</small></div><div class="scenes"><button class="scene active" data-scene="work" aria-pressed="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12a24 24 0 0 0 18 0M12 11v4"></path></svg><span>入职背调</span></button><button class="scene" data-scene="bank" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-6 9 6H3ZM5 10v8m5-8v8m4-8v8m5-8v8M3 21h18"></path></svg><span>银行贷款</span></button><button class="scene" data-scene="rent" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"></path></svg><span>租房材料</span></button><button class="scene" data-scene="custom" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h7m4 0h5M4 12h2m4 0h10M4 18h10m4 0h2"></path><circle cx="13" cy="6" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="18" r="2"></circle></svg><span>自定义</span></button></div></div><div class="field"><label class="fieldlabel" for="text">水印文字<small>可换行</small></label><textarea id="text">仅用于入职背景调查，他用无效</textarea></div><div class="field"><div class="fieldlabel">平铺密度</div><div class="segmented" id="density"><button data-value="150">稀疏</button><button data-value="100">适中</button><button class="active" data-value="65">密集</button></div></div><div class="field"><label class="fieldlabel" for="opacity">透明度<span class="value" id="opacityvalue">18%</span></label><input class="range" id="opacity" type="range" min="5" max="100" value="18"></div><div class="field"><div class="fieldlabel">水印颜色</div><div class="colors"><button class="color active" style="--swatch:#000000" data-color="#000000" aria-label="黑色"></button><button class="color" style="--swatch:#ffffff" data-color="#ffffff" aria-label="白色"></button><button class="color" style="--swatch:#2563eb" data-color="#2563eb" aria-label="蓝色"></button><button class="color" style="--swatch:#ef4444" data-color="#ef4444" aria-label="红色"></button><button class="color" style="--swatch:#10b981" data-color="#10b981" aria-label="绿色"></button><button class="color" style="--swatch:#f59e0b" data-color="#f59e0b" aria-label="黄色"></button><button class="color" style="--swatch:#8b5cf6" data-color="#8b5cf6" aria-label="紫色"></button><span class="colornote" id="colorname">黑色</span></div></div></div><div class="export"><button class="blackbtn" id="export" disabled>添加图片后导出</button><p>打包为 ZIP · 保留图片原始尺寸</p></div></aside></div></main><input id="fileinput" type="file" multiple accept="image/jpeg,image/png,image/webp"><div class="toast" id="toast" role="status"></div>

function update(){const has=items.length>0;$$('.workflow > span').forEach((el,i)=>el.classList.toggle('current',i===(has?1:0)));$('#empty').style.display=has?'none':'flex';$('#canvasarea').style.display=has?'flex':'none';$('#filmstrip').style.display=has?'flex':'none';$('#count').textContent=has?items.length+' 张图片':'未添加图片';$('#prev-image').hidden=!has||items.length<2;$('#next-image').hidden=!has||items.length<2;$('#prev-image').disabled=active===0;$('#next-image').disabled=active>=items.length-1;$('#export').disabled=!has;$('#export').textContent=has?'处理并导出 '+items.length+' 张图片':'添加图片后导出';$('#thumbs').replaceChildren();items.forEach((it,i)=>{const b=document.createElement('button');b.className='thumb'+(active===i?' active':'');b.setAttribute('aria-label',it.name);const img=document.createElement('img');img.src=it.url;img.alt=it.name;b.append(img);b.onclick=()=>{active=i;update()};const wrap=document.createElement('div');wrap.className='thumb-wrap';const remove=document.createElement('button');remove.className='thumb-remove';remove.textContent='×';remove.setAttribute('aria-label','删除 '+it.name);remove.onclick=()=>{URL.revokeObjectURL(it.url);items.splice(i,1);if(i<active)active--;active=Math.max(0,Math.min(active,items.length-1));update()};wrap.append(b,remove);$('#thumbs').append(wrap)});if(has){render()}}

function setPane(pane){document.body.dataset.mobileView=pane;$$('[data-pane]').forEach(x=>{x.classList.toggle('active',x.dataset.pane===pane);x.setAttribute('aria-pressed',String(x.dataset.pane===pane))})};$$('[data-pane]').forEach(b=>b.onclick=()=>setPane(b.dataset.pane));$('#adjust').onclick=()=>setPane('settings');$$('[data-value], [data-color], [data-pane]').forEach(x=>x.setAttribute('aria-pressed',String(x.classList.contains('active'))));
new ResizeObserver(()=>{if(items.length)requestAnimationFrame(render)}).observe($('#canvasarea'));window.addEventListener('resize',()=>requestAnimationFrame(render));
$('#export').onclick=async()=>{if(!$('#text').value.trim())return toast('请先填写水印文字');const b=$('#export');b.disabled=true;b.textContent='正在处理…';try{const zip=new JSZip();for(let i=0;i<items.length;i++){const canvas=document.createElement('canvas');draw(canvas,items[i].img,getPreviewFrame());const blob=await new Promise(r=>canvas.toBlob(r,items[i].type,1));if(!blob||blob.type!==items[i].type)throw new Error('无法按原格式编码');const ext=items[i].name.match(/\.[^.]+$/)?.[0]||'.png';zip.file((i+1)+'_'+items[i].name.replace(/\.[^.]+$/,'')+'_watermarked'+ext,blob)}const blob=await zip.generateAsync({type:'blob'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='watermarked-prototype.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已导出 '+items.length+' 张图片')}catch{toast('导出失败，请重试')}finally{update()}};
</script></body></html>
